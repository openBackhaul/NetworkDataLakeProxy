type: object
properties:
  'core-model-1-4:control-construct':
    type: array
    items:
      type: object
      properties:
        top-level-equipment:
          type: array
          items:
            type: string
        'equipment-augment-1-0:control-construct-pac':
          type: object
          additionalProperties: true
        forwarding-domain:
          type: array
          items:
            type: object
            additionalProperties: true
        profile-collection:
          type: object
          additionalProperties: true
        'firmware-1-0:firmware-collection':
          type: object
          additionalProperties: true
        equipment:
          type: array
          items:
            type: object
            properties:
              uuid:
                type: string
              operational-state:
                type: string
              connector:
                type: array
                items:
                  type: object
                  properties:
                    local-id:
                      type: string
                    'equipment-augment-1-0:connector-pac':
                      type: object
                      properties:
                        connector-kind:
                          type: string
                        sequence-id:
                          type: integer
                        outside-label:
                          type: string
              contained-holder:
                type: array
                items:
                  type: object
                  properties:
                    local-id:
                      type: string
                    occupying-fru:
                      type: string
                    'equipment-augment-1-0:holder-pac':
                      type: object
                      properties:
                        vendor-label:
                          type: string
                        sequence-id:
                          type: integer
                        outside-label:
                          type: string
              expected-equipment:
                type: array
                items:
                  type: object
                  properties:
                    structure:
                      type: object
                      properties:
                        category:
                          type: string
                    manufactured-thing:
                      type: object
                      properties:
                        manufacturer-properties:
                          type: object
                          properties:
                            manufacturer-name:
                              type: string
                        equipment-type:
                          type: object
                          properties:
                            part-type-identifier:
                              type: string
                            version:
                              type: string
                    local-id:
                      type: string
                    operational-state:
                      type: string
              actual-equipment:
                type: object
                properties:
                  structure:
                    type: object
                    properties:
                      category:
                        type: string
                  physical-properties:
                    type: object
                    properties:
                      temperature:
                        type: string
                  manufactured-thing:
                    type: object
                    properties:
                      manufacturer-properties:
                        type: object
                        properties:
                          manufacturer-name:
                            type: string
                      equipment-type:
                        type: object
                        properties:
                          part-type-identifier:
                            type: string
                          version:
                            type: string
                      equipment-instance:
                        type: object
                        properties:
                          manufacture-date:
                            type: string
                          serial-number:
                            type: string
                  operational-state:
                    type: string
        logical-termination-point:
          type: array
          items:
            type: object
            properties:
              uuid:
                type: string
              layer-protocol:
                type: array
                items:
                  type: object
                  oneOf:
                    - description: air-interface
                      type: object
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - >-
                              air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER
                        'air-interface-2-0:air-interface-pac':
                          type: object
                          properties:
                            air-interface-configuration:
                              type: object
                              additionalProperties: true
                    - description: ethernet-container
                      type: object
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - >-
                              ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER
                        'ethernet-container-2-0:ethernet-container-pac':
                          type: object
                          properties:
                            ethernet-container-configuration:
                              type: object
                              additionalProperties: true
                    - description: hybrid-mw-structure
                      type: object
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - >-
                              hybrid-mw-structure-2-0:LAYER_PROTOCOL_NAME_TYPE_HYBRID_MW_STRUCTURE_LAYER
                        'hybrid-mw-structure-2-0:hybrid-mw-structure-pac':
                          type: object
                          properties:
                            hybrid-mw-structure-configuration:
                              type: object
                              additionalProperties: true
                    - description: ip-interface
                      type: object
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - 'ip-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_IP_LAYER'
                        'ip-interface-1-0:ip-interface-pac':
                          type: object
                          properties:
                            ip-interface-configuration:
                              type: object
                              additionalProperties: true
                    - description: mac-interface
                      type: object
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - >-
                              mac-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_MAC_LAYER
                        'mac-interface-1-0:mac-interface-pac':
                          type: object
                          properties:
                            mac-interface-configuration:
                              type: object
                              additionalProperties: true
                    - description: pure-ethernet-structure
                      type: object
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - >-
                              pure-ethernet-structure-2-0:LAYER_PROTOCOL_NAME_TYPE_PURE_ETHERNET_STRUCTURE_LAYER
                        'pure-ethernet-structure-2-0:pure-ethernet-structure-pac':
                          type: object
                          properties:
                            pure-ethernet-structure-configuration:
                              type: object
                              additionalProperties: true
                    - description: tdm-container
                      type: object
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - >-
                              tdm-container-2-0:LAYER_PROTOCOL_NAME_TYPE_TDM_CONTAINER_LAYER
                        'tdm-container-2-0:tdm-container-pac':
                          type: object
                          properties:
                            tdm-container-configuration:
                              type: object
                              additionalProperties: true
                    - description: vlan-interface
                      type: object
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - >-
                              vlan-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_VLAN_LAYER
                        'vlan-interface-1-0:vlan-interface-pac':
                          type: object
                          properties:
                            vlan-interface-configuration:
                              type: object
                              additionalProperties: true
                    - description: wire-interface
                      type: object
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          enum:
                            - >-
                              wire-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_WIRE_LAYER
                        'wire-interface-2-0:wire-interface-pac':
                          type: object
                          properties:
                            wire-interface-configuration:
                              type: object
                              additionalProperties: true
                    - description: 'default, if none of above matching'
                      type: object
                      properties:
                        local-id:
                          type: string
                        layer-protocol-name:
                          type: string
                          not:
                            enum:
                              - >-
                                air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER
                              - >-
                                ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER
                              - >-
                                hybrid-mw-structure-2-0:LAYER_PROTOCOL_NAME_TYPE_HYBRID_MW_STRUCTURE_LAYER
                              - >-
                                ip-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_IP_LAYER
                              - >-
                                mac-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_MAC_LAYER
                              - >-
                                pure-ethernet-structure-2-0:LAYER_PROTOCOL_NAME_TYPE_PURE_ETHERNET_STRUCTURE_LAYER
                              - >-
                                tdm-container-2-0:LAYER_PROTOCOL_NAME_TYPE_TDM_CONTAINER_LAYER
                              - >-
                                vlan-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_VLAN_LAYER
                              - >-
                                wire-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_WIRE_LAYER
