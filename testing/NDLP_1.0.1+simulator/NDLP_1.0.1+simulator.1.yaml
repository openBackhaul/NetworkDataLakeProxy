openapi: 3.0.0
info:
  title: NDLP_1.0.1+simulator.1
  version: 1.0.0

paths:
########################################################################################################################
#   Generic Simulator (generic examples, but all response codes)
########################################################################################################################
  /v1/provide-list-of-connected-devices:
    post:
      operationId: provideListOfConnectedDevices
      summary: 'Provides list of devices that are connected to the controller'
      tags:
        - IndividualServices
      security:
        - basicAuth: []
      responses:
        '200':
          description: 'List of connected devices provided'
          content:
            application/json:
              schema:
                type: object
                required:
                  - mount-name-list
                properties:
                  mount-name-list:
                    type: array
                    items:
                      type: string
              example:
                mount-name-list:
                  - '305251234'
                  - '105258888'
          headers:
            life-cycle-state:
              schema:
                type: string
                enum:
                  - "EXPERIMENTAL"
                  - "OPERATIONAL"
                  - "DEPRECATED"
                  - "OBSOLETE"
                  - "UNKNOWN"
                  - "NOT_YET_DEFINED"
                example: "EXPERIMENTAL"
        "400":
          $ref: "#/components/responses/responseForErroredServiceRequests"
        "401":
          $ref: "#/components/responses/responseForErroredServiceRequests"
        "403":
          $ref: "#/components/responses/responseForErroredServiceRequests"
        "404":
          $ref: "#/components/responses/responseForErroredServiceRequests"
        "500":
          $ref: "#/components/responses/responseForErroredServiceRequests"
        default:
          $ref: "#/components/responses/responseForErroredServiceRequests"


