openapi: 3.0.0
info:
  title: NDLP_1.0.1+simulator.1
  version: 1.0.0

paths:
########################################################################################################################
#   Generic Simulator (generic examples, but all response codes)
########################################################################################################################
  /v1/provide-list-of-connected-devices:
    post:
      operationId: provideListOfConnectedDevices
      summary: 'Provides list of devices that are connected to the controller'
      tags:
        - IndividualServices
      security:
        - basicAuth: []
      responses:
        '200':
          description: 'List of connected devices provided'
          content:
            application/json:
              schema:
                type: object
                required:
                  - mount-name-list
                properties:
                  mount-name-list:
                    type: array
                    items:
                      type: string
              example:
                mount-name-list:
                  - 'string'
                  - 'string'
          headers:
            life-cycle-state:
              schema:
                type: string
                enum:
                  - "EXPERIMENTAL"
                  - "OPERATIONAL"
                  - "DEPRECATED"
                  - "OBSOLETE"
                  - "UNKNOWN"
                  - "NOT_YET_DEFINED"
                example: "EXPERIMENTAL"
        "400":
          $ref: "#/components/responses/responseForErroredServiceRequests"
        "401":
          $ref: "#/components/responses/responseForErroredServiceRequests"
        "403":
          $ref: "#/components/responses/responseForErroredServiceRequests"
        "404":
          $ref: "#/components/responses/responseForErroredServiceRequests"
        "500":
          $ref: "#/components/responses/responseForErroredServiceRequests"
        default:
          $ref: "#/components/responses/responseForErroredServiceRequests"


  /v1/provide-inventory-of-device:
    post:
      operationId: provideInventoryOfDevice
      summary: 'Provides inventory data of the device'
      tags:
        - IndividualServices
      security:
        - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mount-name
              properties:
                mount-name:
                  type: string
      responses:
        '200':
          description: 'Inventory data of device provided'
          content:
            application/json:
              schema:
                type: object
                properties:
                  core-model-1-4:control-construct:
                    type: array
                    items:
                      $ref: '#/components/schemas/FILTERED_CONTROL_CONSTRUCT'
              example:
                core-model-1-4:control-construct:
                  - profile-collection: 'object'
                    equipment-augment-1-0:control-construct-pac: 'object'
                    equipment: 'array'
                    forwarding-domain: 'array'
                    logical-termination-point: 'array'
                    top-level-equipment: 'array'
                    firmware-1-0:firmware-collection: 'object'
          headers:
            life-cycle-state:
              schema:
                type: string
                enum:
                  - "EXPERIMENTAL"
                  - "OPERATIONAL"
                  - "DEPRECATED"
                  - "OBSOLETE"
                  - "UNKNOWN"
                  - "NOT_YET_DEFINED"
                example: "EXPERIMENTAL"
        "400":
          $ref: "#/components/responses/responseForErroredServiceRequests"
        "401":
          $ref: "#/components/responses/responseForErroredServiceRequests"
        "403":
          $ref: "#/components/responses/responseForErroredServiceRequests"
        "404":
          $ref: "#/components/responses/responseForErroredServiceRequests"
        "429":
          description: 'Response in case of errored service requests due to too many parallel requests or too many requests per second.'
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                  - message
                properties:
                  code:
                    type: integer
                    format: int32
                    enum:
                      - 429
                  message:
                    type: string
                    enum:
                      - "Too many requests. The maximum amount of requests that can executed in parallel or per second has been reached"
                example:
                  code: 429
                  message: "Too many requests. The maximum amount of requests that can executed in parallel or per second has been reached"
        "500":
          $ref: "#/components/responses/responseForErroredServiceRequests"
        default:
          $ref: "#/components/responses/responseForErroredServiceRequests"



########################################################################################################################
#   Common Components
########################################################################################################################
components:
  parameters:
    user:
      name: user
      in: header
      required: true
      schema:
        type: string
        example: 'User Name'
      description: 'User identifier from the system starting the service call'
    originator:
      name: originator
      in: header
      required: true
      schema:
        type: string
        minLength: 3
        example: 'Resolver'
      description: >
        'Identification for the system consuming the API, as defined in
         [/core-model-1-4:control-construct/logical-termination-point={uuid}/layer-protocol=0/http-client-interface-1-0:http-client-interface-pac/http-client-interface-configuration/application-name]'
    x-correlator:
      name: x-correlator
      in: header
      required: true
      schema:
        type: string
        pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
        example: '550e8400-e29b-11d4-a716-446655440000'
      description: 'UUID for the service execution flow that allows to correlate requests and responses'
    trace-indicator:
      name: trace-indicator
      in: header
      required: true
      schema:
        type: string
        pattern: '^([0-9]+)(\.([0-9]+))*$'
        example: '1.3.1'
      description: 'Sequence of request numbers along the flow'
    customer-journey:
      name: customer-journey
      in: header
      required: true
      schema:
        type: string
        example: 'Unknown value'
      description: 'Holds information supporting customer’s journey to which the execution applies'
  responses:
    responseForErroredServiceRequests:
      description: 'Response in case of errored service requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
      headers:
        x-correlator:
          schema:
            type: string
            pattern: '^[0-9A-Fa-f]{8}(?:-[0-9A-Fa-f]{4}){3}-[0-9A-Fa-f]{12}$'
            example: '550e8400-e29b-11d4-a716-446655440000'
          description: 'UUID for the service execution flow that allows to correlate requests and responses. Its value must be identical at the response compared with its corresponding request'
        exec-time:
          schema:
            type: integer
            example: 1100
          description: 'Value written by the service provider, reporting the total elapsed time for the execution, including all the additional processing needed to retrieve the data from the backend service. Expressed in milliseconds'
    responseForErroredOamRequests:
      description: 'Response in case of errored OaM requests'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/errorDescription'
  schemas:
    errorDescription:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    genericRepresentation:
      type: object
      required:
        - response-value-list
        - consequent-action-list
      properties:
        response-value-list:
          type: array
          items:
            type: object
            required:
              - field-name
              - value
              - datatype
            properties:
              field-name:
                type: string
                description: >
                  'Field name
                  from [/core-model-1-4:control-construct/profile-collection/profile=ndlp-1-0-0-response-p-*/response-profile-1-0:response-profile-pac/response-profile-capability/field-name]'
              value:
                type: string
                description: >
                  'Field value
                  from [/core-model-1-4:control-construct/profile-collection/profile=ndlp-1-0-0-response-p-*/response-profile-1-0:response-profile-pac/response-profile-configuration/value]'
              datatype:
                type: string
                description: >
                  'Field datatype
                  from [/core-model-1-4:control-construct/profile-collection/profile=ndlp-1-0-0-response-p-*/response-profile-1-0:response-profile-pac/response-profile-capability/datatype]'
        consequent-action-list:
          type: array
          items:
            type: object
            required:
              - label
              - request
              - display-in-new-browser-window
            properties:
              label:
                type: string
                description: >
                  'Label that shall be presented on the button
                  from [/core-model-1-4:control-construct/profile-collection/profile=ndlp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-capability/label]'
              request:
                type: string
                description: >
                  'Request that shall be called, when button gets pressed
                  from
                  [{/core-model-1-4:control-construct/logical-termination-point=ndlp-1-0-0-tcp-s-000/layer-protocol=0/tcp-server-interface-1-0:tcp-server-interface-pac/tcp-server-interface-configuration/local-protocol}]
                  ://
                  [{/core-model-1-4:control-construct/logical-termination-point=ndlp-1-0-0-tcp-s-000/layer-protocol=0/tcp-server-interface-1-0:tcp-server-interface-pac/tcp-server-interface-configuration/local-address/ipv-4-address}
                  or
                  {/core-model-1-4:control-construct/logical-termination-point=ndlp-1-0-0-tcp-s-000/layer-protocol=0/tcp-server-interface-1-0:tcp-server-interface-pac/tcp-server-interface-configuration/local-address/domain-name}]
                  :
                  [{/core-model-1-4:control-construct/logical-termination-point=ndlp-1-0-0-tcp-s-000/layer-protocol=0/tcp-server-interface-1-0:tcp-server-interface-pac/tcp-server-interface-configuration/local-port}]
                  [{/core-model-1-4:control-construct/profile-collection/profile=ndlp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-configuration/consequent-operation-reference}]'
              input-value-list:
                type: array
                items:
                  type: object
                  required:
                    - field-name
                  properties:
                    field-name:
                      type: string
                      description: >
                        'Name of an input value required for executing the Request
                        from [/core-model-1-4:control-construct/profile-collection/profile=ndlp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-capability/input-value-list=*/name]'
                    unit:
                      type: string
                      description: >
                        'Unit of an input value required for executing the Request
                        from [/core-model-1-4:control-construct/profile-collection/profile=ndlp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-capability/input-value-list=*/unit]'
              display-in-new-browser-window:
                type: boolean
                description: >
                  'True in case Request shall be represented in a new browser window
                  from [/core-model-1-4:control-construct/profile-collection/profile=ndlp-1-0-0-action-p-*/action-profile-1-0:action-profile-pac/action-profile-capability/display-in-new-browser-window]'
    logicalTerminationPoint:
      type: object
      required:
        - uuid
        - ltp-direction
        - client-ltp
        - server-ltp
        - layer-protocol
      properties:
        uuid:
          type: string
        ltp-direction:
          type: string
        client-ltp:
          type: array
          uniqueItems: true
          items:
            type: string
        server-ltp:
          type: array
          uniqueItems: true
          items:
            type: string
        layer-protocol:
          type: array
          minItems: 1
          maxItems: 1
          items:
            oneOf:
              - description: 'operation server'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - operation-server-interface-1-0:operation-server-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  operation-server-interface-1-0:operation-server-interface-pac:
                    type: object
                    required:
                      - operation-server-interface-capability
                      - operation-server-interface-configuration
                    properties:
                      operation-server-interface-capability:
                        type: object
                        required:
                          - operation-name
                        properties:
                          operation-name:
                            type: string
                      operation-server-interface-configuration:
                        type: object
                        required:
                          - life-cycle-state
                        properties:
                          life-cycle-state:
                            type: string
              - description: 'http server'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - http-server-interface-1-0:http-server-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  http-server-interface-1-0:http-server-interface-pac:
                    type: object
                    required:
                      - http-server-interface-capability
                    properties:
                      http-server-interface-capability:
                        type: object
                        required:
                          - application-name
                          - release-number
                          - data-update-period
                        properties:
                          application-name:
                            type: string
                          release-number:
                            type: string
                          data-update-period:
                            type: string
              - description: 'tcp server'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - tcp-server-interface-1-0:tcp-server-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  tcp-server-interface-1-0:tcp-server-interface-pac:
                    type: object
                    required:
                      - tcp-server-interface-configuration
                    properties:
                      tcp-server-interface-configuration:
                        type: object
                        required:
                          - description
                          - local-protocol
                          - local-address
                          - local-port
                        properties:
                          description:
                            type: string
                          local-protocol:
                            type: string
                          local-address:
                            type: object
                            properties:
                              ipv-4-address:
                                type: string
                              domain-name:
                                type: string
                          local-port:
                            type: integer
              - description: 'operation client'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - operation-client-interface-1-0:operation-client-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  operation-client-interface-1-0:operation-client-interface-pac:
                    type: object
                    required:
                      - operation-client-interface-configuration
                      - operation-client-interface-status
                    properties:
                      operation-client-interface-configuration:
                        type: object
                        required:
                          - operation-name
                        properties:
                          operation-name:
                            type: string
                      operation-client-interface-status:
                        type: object
                        required:
                          - operational-state
                          - life-cycle-state
                        properties:
                          operational-state:
                            type: string
                          life-cycle-state:
                            type: string
              - description: 'elasticsearch client'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - elasticsearch-client-interface-1-0:elasticsearch-client-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  elasticsearch-client-interface-1-0:elasticsearch-client-interface-pac:
                    type: object
                    required:
                      - elasticsearch-client-interface-configuration
                      - elasticsearch-client-interface-status
                    properties:
                      elasticsearch-client-interface-configuration:
                        type: object
                        required:
                          - index-alias
                        properties:
                          index-alias:
                            type: string
                      elasticsearch-client-interface-status:
                        type: object
                        required:
                          - operational-state
                          - life-cycle-state
                        properties:
                          operational-state:
                            type: string
                          life-cycle-state:
                            type: string
              - description: 'http client'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - http-client-interface-1-0:http-client-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  http-client-interface-1-0:http-client-interface-pac:
                    type: object
                    required:
                      - http-client-interface-configuration
                    properties:
                      http-client-interface-configuration:
                        type: object
                        required:
                          - application-name
                          - release-number
                        properties:
                          application-name:
                            type: string
                          release-number:
                            type: string
              - description: 'tcp client'
                type: object
                required:
                  - local-id
                  - layer-protocol-name
                  - tcp-client-interface-1-0:tcp-client-interface-pac
                properties:
                  local-id:
                    type: string
                  layer-protocol-name:
                    type: string
                  tcp-client-interface-1-0:tcp-client-interface-pac:
                    type: object
                    required:
                      - tcp-client-interface-configuration
                    properties:
                      tcp-client-interface-configuration:
                        type: object
                        required:
                          - remote-protocol
                          - remote-address
                          - remote-port
                        properties:
                          remote-protocol:
                            type: string
                          remote-address:
                            type: object
                            properties:
                              ip-address:
                                type: object
                                properties:
                                  ipv-4-address:
                                    type: string
                              domain-name:
                                type: string
                          remote-port:
                            type: integer
    forwardingDomain:
      type: object
      required:
        - uuid
        - forwarding-construct
      properties:
        uuid:
          type: string
        forwarding-construct:
          type: array
          items:
            type: object
            required:
              - uuid
              - name
              - fc-port
            properties:
              uuid:
                type: string
              name:
                type: array
                items:
                  type: object
                  required:
                    - value-name
                    - value
                  properties:
                    value-name:
                      type: string
                    value:
                      type: string
              fc-port:
                type: array
                items:
                  type: object
                  required:
                    - local-id
                    - port-direction
                    - logical-termination-point
                  properties:
                    local-id:
                      type: string
                    port-direction:
                      type: string
                    logical-termination-point:
                      type: string

    FILTERED_CONTROL_CONSTRUCT:
      type: object
      properties:
        profile-collection:
          type: object
          additionalProperties: true
        equipment-augment-1-0:control-construct-pac:
          type: object
          additionalProperties: true
        equipment:
          type: array
          items:
            $ref: '#/components/schemas/EQUIPMENT'
        forwarding-domain:
          type: array
          items:
            type: object
            additionalProperties: true
        logical-termination-point:
          type: array
          items:
            $ref: '#/components/schemas/LOGICAL_TERMINATION_POINT'
        top-level-equipment:
          type: array
          items:
            type: string
            additionalProperties: true
        firmware-1-0:firmware-collection:
          type: object
          additionalProperties: true

    EQUIPMENT:
      type: object
      additionalProperties: true
      properties:
        uuid:
          type: string
        connector:
          type: array
          items:
            $ref: '#/components/schemas/CONNECTOR'
        contained-holder:
          type: array
          items:
            $ref: '#/components/schemas/CONTAINED_HOLDER'
        expected-equipment:
          type: array
          items:
            $ref: '#/components/schemas/EXPECTED_EQUIPMENT'
        actual-equipment:
          type: object
    CONNECTOR:
      type: object
      additionalProperties: true
      properties:
        local-id:
          type: string
    CONTAINED_HOLDER:
      type: object
      additionalProperties: true
      properties:
        local-id:
          type: string
    EXPECTED_EQUIPMENT:
      type: object
      additionalProperties: true
      properties:
        local-id:
          type: string
    ACTUAL_EQUIPMENT:
      type: object
      additionalProperties: true

    LOGICAL_TERMINATION_POINT:
      type: object
      additionalProperties: true
      properties:
        uuid:
          type: string
        layer-protocol:
          type: array
          items:
            $ref: '#/components/schemas/LAYER_PROTOCOL'
    LAYER_PROTOCOL:
      additionalProperties: true
      oneOf:
        - description: 'air-interface'
          type: object
          properties:
            local-id:
              type: string
            layer-protocol-name:
              type: string
              enum:
                - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
            air-interface-2-0:air-interface-pac:
              type: object
              properties:
                air-interface-configuration:
                  type: object
                  additionalProperties: true
        - description: 'ethernet-container'
          type: object
          properties:
            local-id:
              type: string
            layer-protocol-name:
              type: string
              enum:
                - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
            ethernet-container-2-0:ethernet-container-pac:
              type: object
              properties:
                ethernet-container-configuration:
                  type: object
                  additionalProperties: true
        - description: 'hybrid-mw-structure'
          type: object
          properties:
            local-id:
              type: string
            layer-protocol-name:
              type: string
              enum:
                - 'hybrid-mw-structure-2-0:LAYER_PROTOCOL_NAME_TYPE_HYBRID_MW_STRUCTURE_LAYER'
            hybrid-mw-structure-2-0:hybrid-mw-structure-pac:
              type: object
              properties:
                hybrid-mw-structure-configuration:
                  type: object
                  additionalProperties: true
        - description: 'mac-interface'
          type: object
          properties:
            local-id:
              type: string
            layer-protocol-name:
              type: string
              enum:
                - 'mac-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_MAC_LAYER'
            mac-interface-1-0:mac-interface-pac:
              type: object
              properties:
                mac-interface-configuration:
                  type: object
                  additionalProperties: true
        - description: 'pure-ethernet-structure'
          type: object
          properties:
            local-id:
              type: string
            layer-protocol-name:
              type: string
              enum:
                - 'pure-ethernet-structure-2-0:LAYER_PROTOCOL_NAME_TYPE_PURE_ETHERNET_STRUCTURE_LAYER'
            pure-ethernet-structure-2-0:pure-ethernet-structure-pac:
              type: object
              properties:
                pure-ethernet-structure-configuration:
                  type: object
                  additionalProperties: true
        - description: 'vlan-interface'
          type: object
          properties:
            local-id:
              type: string
            layer-protocol-name:
              type: string
              enum:
                - 'vlan-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_VLAN_LAYER'
            vlan-interface-1-0:vlan-interface-pac:
              type: object
              properties:
                vlan-interface-configuration:
                  type: object
                  additionalProperties: true
        - description: 'wire-interface'
          type: object
          properties:
            local-id:
              type: string
            layer-protocol-name:
              type: string
              enum:
                - 'wire-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_WIRE_LAYER'
            wire-interface-2-0:wire-interface-pac:
              type: object
              properties:
                wire-interface-configuration:
                  type: object
                  additionalProperties: true
        - description: 'ip-interface'
          type: object
          properties:
            local-id:
              type: string
            layer-protocol-name:
              type: string
              enum:
                - 'ip-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_IP_LAYER'
            ip-interface-1-0:ip-interface-pac:
              type: object
              properties:
                ip-interface-configuration:
                  type: object
                  additionalProperties: true
        - description: 'tdm-container'
          type: object
          properties:
            local-id:
              type: string
            layer-protocol-name:
              type: string
              enum:
                - 'tdm-container-2-0:LAYER_PROTOCOL_NAME_TYPE_TDM_CONTAINER_LAYER'
            tdm-container-2-0:tdm-container-pac:
              type: object
              properties:
                tdm-container-configuration:
                  type: object
                  additionalProperties: true
        - description: 'default, if none of above matching'
          type: object
          properties:
            local-id:
              type: string
            layer-protocol-name:
              type: string
              not:
                enum:
                  - 'air-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_AIR_LAYER'
                  - 'ethernet-container-2-0:LAYER_PROTOCOL_NAME_TYPE_ETHERNET_CONTAINER_LAYER'
                  - 'hybrid-mw-structure-2-0:LAYER_PROTOCOL_NAME_TYPE_HYBRID_MW_STRUCTURE_LAYER'
                  - 'ip-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_IP_LAYER'
                  - 'mac-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_MAC_LAYER'
                  - 'pure-ethernet-structure-2-0:LAYER_PROTOCOL_NAME_TYPE_PURE_ETHERNET_STRUCTURE_LAYER'
                  - 'tdm-container-2-0:LAYER_PROTOCOL_NAME_TYPE_TDM_CONTAINER_LAYER'
                  - 'vlan-interface-1-0:LAYER_PROTOCOL_NAME_TYPE_VLAN_LAYER'
                  - 'wire-interface-2-0:LAYER_PROTOCOL_NAME_TYPE_WIRE_LAYER'

  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: operation-key
    basicAuth:
